<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IQRA ACADEMY - Driver Manual GPS Portal</title>
    <link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/u0z4riei/image/upload/v1792241337/WhatsApp_Image_2026-10-17_at_6.14.01_PM.jpg">
    <meta name="theme-color" content="#1e3a8a">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f1f5f9; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1rem; }

        .app-container { width: 100%; max-width: 440px; margin: auto; }

        .header-card {
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
            color: white; padding: 1.25rem; border-radius: 16px; text-align: center;
            box-shadow: 0 8px 20px rgba(30, 58, 138, 0.25); margin-bottom: 1rem;
        }
        .header-card img { width: 56px; height: 56px; border-radius: 50%; border: 2px solid #fef08a; background: white; padding: 2px; margin-bottom: 0.4rem; object-fit: cover; }
        .header-card h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: 0.5px; }
        .header-card p { font-size: 0.8rem; color: #bfdbfe; margin-top: 2px; }

        .card {
            background: white; padding: 1.35rem; border-radius: 16px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06); border: 1px solid #e2e8f0; margin-bottom: 1rem;
        }
        .card-title { font-size: 1rem; font-weight: 700; color: #1e3a8a; margin-bottom: 1rem; border-bottom: 2px solid #dbeafe; padding-bottom: 0.4rem; display: flex; justify-content: space-between; align-items: center; }

        .form-group { margin-bottom: 0.85rem; }
        label { display: block; font-size: 0.82rem; font-weight: 600; color: #334155; margin-bottom: 0.3rem; }
        input {
            width: 100%; padding: 0.7rem 0.85rem; border: 1.5px solid #cbd5e1; border-radius: 10px;
            font-size: 0.95rem; outline: none; transition: 0.2s; background: #f8fafc;
        }
        input:focus { border-color: #2563eb; background: #fff; }

        .btn {
            width: 100%; padding: 0.85rem 1rem; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px; color: white;
        }
        .btn-login { background: #2563eb; }
        .btn-login:hover { background: #1d4ed8; }
        .btn-sync { background: #059669; box-shadow: 0 6px 16px rgba(5, 150, 105, 0.3); font-size: 1.05rem; padding: 1rem; }
        .btn-sync:hover { background: #047857; }
        .btn-offline { background: #dc2626; margin-top: 0.6rem; font-size: 0.85rem; padding: 0.65rem; }
        .btn-logout { background: #64748b; font-size: 0.82rem; padding: 0.45rem 0.8rem; width: auto; border-radius: 8px; }

        .driver-badge {
            background: #eff6ff; border: 1.5px solid #bfdbfe; border-radius: 12px;
            padding: 0.85rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;
        }
        .driver-badge-info h3 { font-size: 1.05rem; color: #1e3a8a; font-family: monospace; }
        .driver-badge-info p { font-size: 0.82rem; color: #475569; font-weight: 600; }

        .gps-stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 0.75rem; margin-bottom: 1rem;
        }
        .stat-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 0.55rem; border-radius: 8px; text-align: center; }
        .stat-box span { display: block; font-size: 0.7rem; color: #64748b; font-weight: 600; }
        .stat-box strong { font-size: 0.88rem; color: #0f172a; font-family: monospace; }

        .status-banner {
            margin-top: 0.75rem; padding: 0.65rem; border-radius: 8px; font-size: 0.84rem;
            font-weight: 600; text-align: center; display: none;
        }
        .status-ok { background: #dcfce7; color: #166534; }
        .status-err { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-card">
        <img src="https://res.cloudinary.com/u0z4riei/image/upload/v1792241337/WhatsApp_Image_2026-10-17_at_6.14.01_PM.jpg" alt="Logo">
        <h1>IQRA ACADEMY</h1>
        <p>🚐 ড্রাইভার ম্যানুয়াল লোকেশন আপডেট পোর্টাল</p>
    </div>

    <!-- ১. ড্রাইভার লগইন -->
    <div class="card" id="loginView">
        <div class="card-title">🔐 ড্রাইভার প্রোফাইল সেটআপ</div>
        <div class="form-group">
            <label>ড্রাইভার কোড (Driver Code) *</label>
            <input type="text" id="dCode" placeholder="যেমন: DRV-001" style="text-transform:uppercase; font-weight:700; color:#1e3a8a;">
        </div>
        <div class="form-group">
            <label>ড্রাইভারের নাম *</label>
            <input type="text" id="dName" placeholder="আপনার নাম লিখুন">
        </div>
        <div class="form-group">
            <label>গাড়ির বিবরণ *</label>
            <input type="text" id="dVehicle" placeholder="যেমন: Car 1 / WB-25-XXXX">
        </div>
        <div class="form-group">
            <label>মোবাইল নম্বর *</label>
            <input type="text" id="dPhone" placeholder="যেমন: 9876543210">
        </div>
        <button class="btn btn-login" onclick="saveDriverProfile()">✅ ড্যাশবোর্ডে প্রবেশ করুন</button>
    </div>

    <!-- ২. ম্যানুয়াল জিপিএস ড্যাশবোর্ড -->
    <div class="card" id="dashboardView" style="display:none;">
        <div class="card-title">
            <span>📡 লোকেশন পাঠানো</span>
            <button class="btn btn-logout" onclick="handleLogout()">লগআউট</button>
        </div>

        <div class="driver-badge">
            <div class="driver-badge-info">
                <h3 id="dispCode">DRV-001</h3>
                <p id="dispDetails">Driver Name • Car 1</p>
            </div>
            <span style="font-size:1.6rem;">🚐</span>
        </div>

        <p style="font-size:0.8rem; color:#475569; margin-bottom:0.75rem; text-align:center;">
            গাড়ি যখন কোনো স্টপেজে পৌঁছাবে বা লোকেশন আপডেট করার প্রয়োজন হবে, নিচের বাটনে চাপ দিন:
        </p>

        <div class="gps-stats">
            <div class="stat-box">
                <span>LATITUDE</span>
                <strong id="latVal">--.------</strong>
            </div>
            <div class="stat-box">
                <span>LONGITUDE</span>
                <strong id="lngVal">--.------</strong>
            </div>
            <div class="stat-box">
                <span>ACCURACY</span>
                <strong id="accVal">-- m</strong>
            </div>
            <div class="stat-box">
                <span>LAST SENT</span>
                <strong id="syncTimeVal">--:--:--</strong>
            </div>
        </div>

        <!-- সিঙ্গেল ক্লিক জিপিএস আপডেট বাটন -->
        <button id="btnManualPush" class="btn btn-sync" onclick="captureAndPushGPS()">
            📍 আমার বর্তমান লোকেশন পাঠান
        </button>

        <!-- ডিউটি শেষ / অফলাইন বাটন -->
        <button class="btn btn-offline" onclick="sendOfflineStatus()">
            🔴 ডিউটি শেষ (অফলাইন করুন)
        </button>

        <div id="statusMsg" class="status-banner"></div>
    </div>
</div>

<script>
    const API_WORKER_URL = "https://iqra-api-worker.tarikul-aisj.workers.dev";

    window.onload = function() {
        checkSavedLogin();
    };

    function checkSavedLogin() {
        try {
            const savedDriver = localStorage.getItem("IQRA_DRIVER_PROFILE");
            if (savedDriver) {
                const profile = JSON.parse(savedDriver);
                if (profile && profile.driverCode) {
                    showDashboard(profile);
                    return;
                }
            }
        } catch (e) {}
        document.getElementById("loginView").style.display = "block";
        document.getElementById("dashboardView").style.display = "none";
    }

    function saveDriverProfile() {
        const driverCode = document.getElementById("dCode").value.trim().toUpperCase();
        const driverName = document.getElementById("dName").value.trim();
        const vehicleName = document.getElementById("dVehicle").value.trim();
        const phone = document.getElementById("dPhone").value.trim();

        if (!driverCode || !driverName) {
            alert("অনুগ্রহ করে ড্রাইভার কোড ও নাম লিখুন!");
            return;
        }

        const profile = { driverCode, driverName, vehicleName: vehicleName || "School Van", phone };
        try { localStorage.setItem("IQRA_DRIVER_PROFILE", JSON.stringify(profile)); } catch (e) {}
        showDashboard(profile);
    }

    function showDashboard(profile) {
        document.getElementById("loginView").style.display = "none";
        document.getElementById("dashboardView").style.display = "block";
        document.getElementById("dispCode").innerText = profile.driverCode;
        document.getElementById("dispDetails").innerText = `${profile.driverName} • ${profile.vehicleName}`;
    }

    function handleLogout() {
        try { localStorage.removeItem("IQRA_DRIVER_PROFILE"); } catch (e) {}
        document.getElementById("loginView").style.display = "block";
        document.getElementById("dashboardView").style.display = "none";
    }

    function captureAndPushGPS() {
        if (!navigator.geolocation) {
            showBanner("আপনার ফোনের ব্রাউজারে GPS সাপোর্ট নেই!", false);
            return;
        }

        const btn = document.getElementById("btnManualPush");
        btn.disabled = true;
        btn.innerText = "⏳ জিপিএস সংগ্রহ ও পাঠানো হচ্ছে...";

        navigator.geolocation.getCurrentPosition(
            pos => {
                const lat = pos.coords.latitude.toFixed(6);
                const lng = pos.coords.longitude.toFixed(6);
                const acc = Math.round(pos.coords.accuracy);

                document.getElementById("latVal").innerText = lat;
                document.getElementById("lngVal").innerText = lng;
                document.getElementById("accVal").innerText = acc + " m";

                sendLocationToServer(lat, lng);
            },
            err => {
                btn.disabled = false;
                btn.innerText = "📍 আমার বর্তমান লোকেশন পাঠান";
                showBanner("GPS পারমিশন দিন: " + err.message, false);
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    function sendLocationToServer(lat, lng) {
        let profile = {};
        try { profile = JSON.parse(localStorage.getItem("IQRA_DRIVER_PROFILE") || "{}"); } catch (e) {}
        const btn = document.getElementById("btnManualPush");

        fetch(API_WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                action: "updateDriverLocation",
                driverCode: profile.driverCode,
                driverName: profile.driverName,
                vehicleName: profile.vehicleName,
                phone: profile.phone,
                lat: lat,
                lng: lng
            })
        })
        .then(r => r.json())
        .then(res => {
            if (res && res.success) {
                document.getElementById("syncTimeVal").innerText = new Date().toLocaleTimeString('en-IN', { hour12: false });
                showBanner("✅ গুগল শিটে লোকেশন আপডেট সফল!", true);
            } else {
                showBanner("সার্ভার ত্রুটি: " + (res ? res.error : "Unknown"), false);
            }
        })
        .catch(err => {
            showBanner("নেটওয়ার্ক এরর: " + err.message, false);
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "📍 আমার বর্তমান লোকেশন পাঠান";
        });
    }

    function sendOfflineStatus() {
        let profile = {};
        try { profile = JSON.parse(localStorage.getItem("IQRA_DRIVER_PROFILE") || "{}"); } catch (e) {}

        fetch(API_WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                action: "updateDriverLocation",
                driverCode: profile.driverCode,
                driverName: profile.driverName,
                vehicleName: profile.vehicleName,
                phone: profile.phone,
                lat: "OFFLINE",
                lng: "OFFLINE"
            })
        })
        .then(() => {
            document.getElementById("latVal").innerText = "--.------";
            document.getElementById("lngVal").innerText = "--.------";
            showBanner("গাড়ি অফলাইন করা হয়েছে।", true);
        })
        .catch(() => {});
    }

    function showBanner(msg, isOk) {
        const el = document.getElementById("statusMsg");
        el.style.display = "block";
        el.innerText = msg;
        el.className = "status-banner " + (isOk ? "status-ok" : "status-err");
    }
</script>
</body>
</html>
